{% extends "base.html" %}
{% from "_macros.html" import tabs, todo_list with context %}

{% block content %}
{{ tabs(page, active_count, done_count) }}

{% if todos %}
{{ todo_list(todos, page) }}
{% else %}
<div class="card card-body text-center py-5 shadow-sm">
  <p class="text-body-secondary mb-3">やることはまだありません</p>
  <div><a class="btn btn-primary" href="{{ url_for('new') }}">やることを登録する</a></div>
</div>
{% endif %}
{% endblock %}
